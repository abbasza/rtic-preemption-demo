
[package]
name = "rtic-preemption-demo"
version = "0.1.0"
edition = "2021"
description = "RTIC priority-based preemption and shared-resource demonstration on QEMU"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["embedded", "rust", "rtic", "qemu", "real-time"]
categories = ["embedded", "no-std"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.1.4"
cortex-m-semihosting = "0.5.0"
lm3s6965 = "0.1.3"
panic-halt = "0.2.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
